<script>
function updateClock() {
    const now = new Date();
    const dateStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
    const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    const clockEl = document.getElementById('realTimeClock');
    if(clockEl) clockEl.innerHTML = `<i class="fa-regular fa-clock text-red-500 mr-1"></i> ${dateStr} ${timeStr}`;
}
setInterval(updateClock, 1000);
updateClock();

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openManualModal() {
    let formEl = document.getElementById('formPendaftaranTruk');
    if (formEl) formEl.reset(); 
    let todayIso = new Date().toISOString().split('T')[0];
    document.getElementById('mTanggal').value = todayIso;
    openModal('modalManual');
}

let truckQueue = [];

async function loadDataFromCloud() {
    if (!window.db) return;
    try {
        const { collection, getDocs } = window.firebaseCollections;
        let snap = await getDocs(collection(window.db, 'antrian_raw_material'));
        
        truckQueue = [];
        snap.forEach(d => {
            truckQueue.push({ ...d.data(), firestoreId: d.id });
        });
        renderAll();
        updateRunningTextSummary();
    } catch (e) {
        console.error('Error load database:', e);
    }
}

function updateRunningTextSummary() {
    let countSemua = truckQueue.length;
    let countAntri = truckQueue.filter(t => t.status === 'Masuk').length;
    let countQc = truckQueue.filter(t => t.status === 'Proses QC').length;
    let countBongkar = truckQueue.filter(t => t.status === 'Proses Bongkar').length;
    let countSelesai = truckQueue.filter(t => t.status === 'Selesai').length;
    let countReject = truckQueue.filter(t => t.status === 'Ditolak / Reject').length;

    if(document.getElementById('rtSemua')) document.getElementById('rtSemua').querySelector('b').innerText = countSemua;
    if(document.getElementById('rtAntrian')) document.getElementById('rtAntrian').querySelector('b').innerText = countAntri;
    if(document.getElementById('rtQc')) document.getElementById('rtQc').querySelector('b').innerText = countQc;
    if(document.getElementById('rtBongkar')) document.getElementById('rtBongkar').querySelector('b').innerText = countBongkar;
    if(document.getElementById('rtSelesai')) document.getElementById('rtSelesai').querySelector('b').innerText = countSelesai;
    if(document.getElementById('rtReject')) document.getElementById('rtReject').querySelector('b').innerText = countReject;
}

async function submitAntrian(e) {
    e.preventDefault();
    const { addDoc, collection, getDocs, query, where } = window.firebaseCollections;

    let tanggalVal = document.getElementById('mTanggal').value;
    let currentTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    let currentIsoTime = new Date().toISOString();

    try {
        const q = query(collection(window.db, 'antrian_raw_material'), where("tanggal", "==", tanggalVal));
        const querySnapshot = await getDocs(q);
        let maxSeq = 0;
        querySnapshot.forEach(docSnap => {
            let seq = parseInt(docSnap.data().no_urut) || 0;
            if (seq > maxSeq) maxSeq = seq;
        });

        let nextNumber = maxSeq + 1;
        let formattedQueueNumber = String(nextNumber).padStart(3, '0');

        let newRecord = {
            tanggal: tanggalVal,
            no_urut: formattedQueueNumber,
            sopir: document.getElementById('mSopir').value,
            supplier: document.getElementById('mSupplier').value,
            no_pol: document.getElementById('mNoPol').value.toUpperCase(),
            no_doc: document.getElementById('mNoDoc').value,
            material: document.getElementById('mMaterial').value,
            status: 'Masuk',
            time_masuk: currentTimeStr,
            time_start_qc: '-',
            time_finish_qc: '-',
            time_start_bongkar: '-',
            time_finish_bongkar: '-',
            time_keluar: '-',
            reject_reason: '-',
            created_at: currentIsoTime
        };

        await addDoc(collection(window.db, 'antrian_raw_material'), newRecord);
        alert(`Truk Raw Material berhasil didaftarkan dengan No. Urut: ${formattedQueueNumber} !`);
        closeModal('modalManual');
        loadDataFromCloud();
    } catch (err) {
        alert('Gagal menyimpan ke database: ' + err.message);
    }
}

let activeTruckIndex = null;
function openStatusModal(idx) {
    activeTruckIndex = idx;
    let t = truckQueue[idx];
    document.getElementById('selectStatus').value = t.status;
    checkStatusModalFields();
    openModal('modalStatus');
}

function checkStatusModalFields() {
    let st = document.getElementById('selectStatus').value;
    document.getElementById('rejectNoteDiv').style.display = (st === 'Ditolak / Reject') ? 'block' : 'none';
}

async function saveStatusRM() {
    if (activeTruckIndex === null) return;
    let t = truckQueue[activeTruckIndex];
    let newStatus = document.getElementById('selectStatus').value;
    let currentTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    
    let updateData = { status: newStatus };
    
    if (newStatus === 'Proses QC' && t.time_start_qc === '-') updateData.time_start_qc = currentTimeStr;
    if (newStatus === 'Proses Bongkar') {
        if (t.time_finish_qc === '-') updateData.time_finish_qc = currentTimeStr;
        if (t.time_start_bongkar === '-') updateData.time_start_bongkar = currentTimeStr;
    }
    if (newStatus === 'Selesai' && t.time_finish_bongkar === '-') updateData.time_finish_bongkar = currentTimeStr;
    if (newStatus === 'Keluar' && t.time_keluar === '-') updateData.time_keluar = currentTimeStr;
    if (newStatus === 'Ditolak / Reject') {
        updateData.reject_reason = document.getElementById('inputRejectReason').value || 'Tidak memenuhi spesifikasi QC';
    }

    const { updateDoc, doc } = window.firebaseCollections;
    try {
        await updateDoc(doc(window.db, 'antrian_raw_material', t.firestoreId), updateData);
        closeModal('modalStatus');
        loadDataFromCloud();
        alert('Status dan Timestamp berhasil diperbarui!');
    } catch (err) {
        alert('Gagal update status: ' + err.message);
    }
}

async function deleteTruck(idx) {
    let t = truckQueue[idx];
    if (confirm(`Yakin ingin menghapus data truk ${t.no_pol}?`)) {
        const { deleteDoc, doc } = window.firebaseCollections;
        try {
            await deleteDoc(doc(window.db, 'antrian_raw_material', t.firestoreId));
            loadDataFromCloud();
        } catch (err) {
            alert('Gagal menghapus: ' + err.message);
        }
    }
}

let currentMainTab = 'SemuaTab';
function switchMainTab(tabName, btn) {
    currentMainTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    renderAll();
}

function renderAll() {
    let container = document.getElementById('antrianCardContainer');
    let keyword = (document.getElementById('searchInput').value || '').toLowerCase();
    if(!container) return;

    document.getElementById('countSemuaTab').innerText = truckQueue.length;
    document.getElementById('countAntrianTab').innerText = truckQueue.filter(t => t.status === 'Masuk').length;
    document.getElementById('countQcTab').innerText = truckQueue.filter(t => t.status === 'Proses QC').length;
    document.getElementById('countBongkarTab').innerText = truckQueue.filter(t => t.status === 'Proses Bongkar').length;
    document.getElementById('countSelesaiTab').innerText = truckQueue.filter(t => t.status === 'Selesai').length;
    document.getElementById('countRejectTab').innerText = truckQueue.filter(t => t.status === 'Ditolak / Reject').length;

    let filtered = truckQueue.filter(t => {
        let matchTab = true;
        if(currentMainTab === 'AntrianTab') matchTab = (t.status === 'Masuk');
        else if(currentMainTab === 'QcTab') matchTab = (t.status === 'Proses QC');
        else if(currentMainTab === 'BongkarTab') matchTab = (t.status === 'Proses Bongkar');
        else if(currentMainTab === 'SelesaiTab') matchTab = (t.status === 'Selesai');
        else if(currentMainTab === 'RejectTab') matchTab = (t.status === 'Ditolak / Reject');
        else if(currentMainTab === 'KeluarTab') matchTab = (t.status === 'Keluar');

        let textMatch = (t.no_pol.toLowerCase().includes(keyword) || 
                         t.sopir.toLowerCase().includes(keyword) || 
                         t.supplier.toLowerCase().includes(keyword) || 
                         t.material.toLowerCase().includes(keyword) ||
                         t.no_doc.toLowerCase().includes(keyword));
        return matchTab && textMatch;
    });

    if(filtered.length === 0) {
        container.innerHTML = '<div class="card" style="text-align:center; color:#94a3b8; padding:30px;">Tidak ada data antrian raw material.</div>';
        return;
    }

    let html = '';
    filtered.forEach((t, idx) => {
        let cleanPhone = '628123456789';
        let rejectInfo = (t.status === 'Ditolak / Reject') ? `<br><span style="color:#b91c1c; font-weight:bold;">⚠️ Alasan Tolak: ${t.reject_reason || '-'}</span>` : '';

        html += `<div class="card">
            <div class="card-ribbon ribbon-supplier">Supplier RM</div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <span style="background:#fef3c7; color:#b45309; padding:2px 8px; border-radius:6px; font-weight:bold; font-size:10px;">No. ${t.no_urut}</span>
                        <strong style="font-size:12px; color:#1e293b;">${t.no_pol}</strong>
                        <span style="color:#cbd5e1;">&bull;</span>
                        <span style="font-weight:600; color:#991b1b;">${t.supplier}</span>
                        <span style="color:#cbd5e1;">&bull;</span>
                        <span style="color:#0284c7; font-weight:600;">Doc: ${t.no_doc}</span>
                    </div>

                    <div style="color:#475569; font-size:11px;">
                        Sopir: <strong>${t.sopir}</strong> | 📦 Material: <b style="color:#1d4ed8;">${t.material}</b> ${rejectInfo}
                    </div>

                    <div style="font-size: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 2px;">
                        <span style="background:#f1f5f9; color:#334155; padding:3px 8px; border-radius:6px; font-weight:bold;">Status: ${t.status}</span>
                        <span style="background:#eff6ff; color:#1d4ed8; padding:3px 8px; border-radius:6px; font-weight:bold;">📥 Masuk: ${t.time_masuk}</span>
                        <span style="background:#fef3c7; color:#92400e; padding:3px 8px; border-radius:6px; font-weight:bold;">🔬 Start QC: ${t.time_start_qc}</span>
                        <span style="background:#e0e7ff; color:#3730a3; padding:3px 8px; border-radius:6px; font-weight:bold;">🏁 Finish QC: ${t.time_finish_qc}</span>
                        <span style="background:#ecfdf5; color:#065f46; padding:3px 8px; border-radius:6px; font-weight:bold;">🏗️ Start Bongkar: ${t.time_start_bongkar}</span>
                        <span style="background:#f3e8ff; color:#6b21a8; padding:3px 8px; border-radius:6px; font-weight:bold;">✅ Finish Bongkar: ${t.time_finish_bongkar}</span>
                        <span style="background:#fef2f2; color:#b91c1c; padding:3px 8px; border-radius:6px; font-weight:bold;">📤 Keluar: ${t.time_keluar}</span>
                    </div>
                </div>

                <div style="display:flex; gap:6px; align-items:center;">
                    <button class="btn btn-primary" onclick="openStatusModal(${truckQueue.indexOf(t)})">Pindah Status</button>
                    <button class="btn btn-danger" onclick="deleteTruck(${truckQueue.indexOf(t)})">Hapus</button>
                </div>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

async function resetData() {
    if (confirm('Yakin ingin mereset semua data antrian raw material?')) {
        const { getDocs, collection, deleteDoc, doc } = window.firebaseCollections;
        let snap = await getDocs(collection(window.db, 'antrian_raw_material'));
        for (let d of snap.docs) {
            await deleteDoc(doc(window.db, 'antrian_raw_material', d.id));
        }
        loadDataFromCloud();
    }
}
</script>
